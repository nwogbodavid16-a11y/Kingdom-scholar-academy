<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom Scholar Academy · Fee Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132242;
    --navy-deep:#0C1830;
    --navy-mid:#1D3161;
    --gold:#C39A3E;
    --gold-light:#E7CE8C;
    --cream:#F8F5EE;
    --paper:#FFFFFF;
    --ink:#20242C;
    --muted:#6B7180;
    --line:#E5E0D4;
    --success:#2F6B4F;
    --success-bg:#EAF3EE;
    --warn:#9C6B14;
    --warn-bg:#FBF1DD;
    --danger:#AE3B2E;
    --danger-bg:#FBEAE7;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',Georgia,serif; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; }

  /* ---------- Layout ---------- */
  #app{ display:flex; min-height:100vh; }

  .sidebar{
    width:248px;
    flex-shrink:0;
    background:var(--navy-deep);
    color:#DCE2EE;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .crest-wrap{
    padding:24px 20px 18px 20px;
    border-bottom:1px solid rgba(255,255,255,0.09);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
  }
  .brand-emblem{ width:76px; height:auto; display:block; }
  .brand-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; line-height:1.3; color:#F3EFE3; }
  .brand-motto{ font-size:11px; font-style:italic; color:var(--gold-light); margin-top:4px; }
  .brand-sub{ font-size:10px; letter-spacing:.14em; color:#B7A25A; margin-top:6px; }

  .nav{ padding:14px 12px; flex:1; overflow-y:auto; }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; margin-bottom:2px;
    border-radius:var(--radius);
    font-size:13.5px; color:#B7C0D6;
    border-left:2px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{ width:16px; height:16px; flex-shrink:0; opacity:.85; }
  .nav-item:hover{ background:rgba(255,255,255,0.05); color:#F1EEE3; cursor:pointer; }
  .nav-item.active{
    background:rgba(195,154,62,0.14);
    color:#F3EFE3;
    border-left:2px solid var(--gold);
    font-weight:600;
  }
  .nav-section-label{
    font-size:10px; letter-spacing:.08em; color:#5C6684;
    padding:16px 12px 6px 12px;
  }
  .sidebar-foot{
    padding:14px 20px 18px 20px; border-top:1px solid rgba(255,255,255,0.09);
    font-size:11px; color:#5C6684;
  }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    background:var(--paper); border-bottom:1px solid var(--line);
    padding:14px 30px; display:flex; align-items:center; justify-content:space-between;
    gap:16px; position:sticky; top:0; z-index:5;
  }
  .topbar h2{ margin:0; font-size:19px; font-weight:600; }
  .topbar-meta{ font-size:12px; color:var(--muted); margin-top:2px; font-family:'Inter'; }
  .topbar-controls{ display:flex; align-items:center; gap:10px; }
  .period-pill{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--line); border-radius:20px; padding:5px 6px 5px 12px;
    font-size:12.5px; background:#FBFAF6;
  }
  .period-pill select{ border:none; background:transparent; font-size:12.5px; font-weight:600; color:var(--navy); padding:3px 4px; }

  .content{ padding:26px 30px 60px 30px; }

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:9px 16px; border-radius:var(--radius); font-size:13px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{ border-color:#C9C2AE; }
  .btn-primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn-primary:hover{ background:var(--navy-mid); }
  .btn-gold{ background:var(--gold); border-color:var(--gold); color:#2A1F04; }
  .btn-gold:hover{ background:var(--gold-light); }
  .btn-danger{ color:var(--danger); border-color:#E9C9C1; background:var(--danger-bg); }
  .btn-danger:hover{ background:#F6DCD5; }
  .btn-sm{ padding:5px 11px; font-size:12px; }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--muted); }
  .btn-ghost:hover{ color:var(--ink); background:#EFEBDF; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- Cards / stats ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  .stat-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 18px; border-left:3px solid var(--navy);
  }
  .stat-card.gold{ border-left-color:var(--gold); }
  .stat-card.good{ border-left-color:var(--success); }
  .stat-card.bad{ border-left-color:var(--danger); }
  .stat-label{ font-size:11.5px; color:var(--muted); letter-spacing:.02em; margin-bottom:8px; }
  .stat-value{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--navy); }
  .stat-sub{ font-size:11.5px; color:var(--muted); margin-top:6px; }

  .panel{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:22px;
  }
  .panel-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .panel-head h3{ margin:0; font-size:15.5px; font-weight:600; }
  .panel-body{ padding:18px 20px; }
  .panel-body.flush{ padding:0; }

  /* ---------- Tables ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{
    text-align:left; font-size:11px; letter-spacing:.03em; color:var(--muted);
    padding:10px 14px; border-bottom:1px solid var(--line); background:#FBFAF6; font-weight:600;
  }
  td{ padding:11px 14px; border-bottom:1px solid #EFEBDF; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FCFBF7; }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .muted{ color:var(--muted); }
  .empty-row td{ text-align:center; color:var(--muted); padding:34px 14px; }

  /* ---------- Badges ---------- */
  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge-paid{ background:var(--success-bg); color:var(--success); }
  .badge-partial{ background:var(--warn-bg); color:var(--warn); }
  .badge-unpaid{ background:var(--danger-bg); color:var(--danger); }

  /* ---------- Forms ---------- */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.span2{ grid-column:1/-1; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink); }
  .field .hint{ font-size:11px; color:var(--muted); font-weight:400; }
  .field input, .field select, .field textarea{
    border:1px solid var(--line); border-radius:var(--radius); padding:9px 11px; font-size:13.5px;
    background:#FEFDFA; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--navy); background:#fff;
  }
  .search-bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .search-bar input, .search-bar select{
    border:1px solid var(--line); border-radius:var(--radius); padding:8px 11px; font-size:13px; background:#FEFDFA;
  }

  /* ---------- Fee structure grid ---------- */
  .fee-table input{ width:100px; text-align:right; border:1px solid var(--line); border-radius:3px; padding:6px 8px; font-size:12.5px; }
  .fee-table th, .fee-table td{ padding:8px 10px; }
  .fee-total-cell{ font-weight:700; color:var(--navy); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(12,18,30,0.55); display:flex; align-items:flex-start;
    justify-content:center; z-index:100; padding:40px 16px; overflow-y:auto;
  }
  .modal{
    background:var(--paper); border-radius:6px; width:100%; max-width:640px;
    box-shadow:0 18px 48px rgba(0,0,0,0.28);
  }
  .modal.wide{ max-width:760px; }
  .modal-head{ padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .modal-head h3{ margin:0; font-size:16.5px; }
  .modal-body{ padding:20px 22px; max-height:70vh; overflow-y:auto; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }
  .close-x{ background:none; border:none; font-size:20px; color:var(--muted); line-height:1; padding:2px 6px; }
  .close-x:hover{ color:var(--ink); }

  /* ---------- Payment allocation rows ---------- */
  .alloc-row{ display:grid; grid-template-columns:1.6fr .9fr .9fr 1fr; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid #F0ECDF; }
  .alloc-row:last-child{ border-bottom:none; }
  .alloc-row .cat-name{ font-size:13px; font-weight:600; }
  .alloc-row .amt-label{ font-size:11px; color:var(--muted); }
  .alloc-row input{ width:100%; border:1px solid var(--line); border-radius:3px; padding:7px 9px; text-align:right; font-size:13px; }

  /* ---------- Receipt ---------- */
  .receipt{ background:#fff; padding:8px 4px; }
  .receipt-top{ display:flex; align-items:center; gap:14px; border-bottom:2px solid var(--navy); padding-bottom:14px; margin-bottom:16px; }
  .receipt-crest{ width:56px; height:auto; flex-shrink:0; }
  .receipt-crest img{ width:100%; height:auto; display:block; }
  .receipt-motto{ font-size:11px; font-style:italic; color:var(--gold); margin-top:1px; }
  .receipt-school{ font-family:'Fraunces'; font-size:19px; font-weight:700; color:var(--navy); }
  .receipt-school-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .receipt-title{ text-align:right; margin-left:auto; }
  .receipt-title .rno{ font-family:'Fraunces'; font-size:15px; font-weight:600; color:var(--navy); }
  .receipt-title .rdate{ font-size:11.5px; color:var(--muted); }
  .receipt-meta{ display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; font-size:13px; margin-bottom:16px; }
  .receipt-meta div span{ color:var(--muted); }
  .receipt table td, .receipt table th{ padding:9px 10px; }
  .receipt-total-row td{ font-weight:700; font-size:14.5px; border-top:2px solid var(--navy); }
  .receipt-foot{ margin-top:22px; font-size:11.5px; color:var(--muted); border-top:1px dashed var(--line); padding-top:12px; }
  .sign-line{ margin-top:34px; display:flex; justify-content:space-between; font-size:12px; }
  .sign-line div{ width:44%; border-top:1px solid var(--ink); padding-top:5px; text-align:center; color:var(--muted); }

  @media print{
    body *{ visibility:hidden; }
    .receipt-print-area, .receipt-print-area *{ visibility:visible; }
    .receipt-print-area{ position:absolute; top:0; left:0; width:100%; padding:20px; }
    .modal-head, .modal-foot{ display:none !important; }
  }

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--navy); color:#fff; padding:12px 18px;
    border-radius:5px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:200;
    display:flex; align-items:center; gap:8px;
  }

  .class-chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .class-chip{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:20px;
    padding:6px 12px; font-size:12.5px; background:#FBFAF6;
  }
  .class-chip button{ background:none; border:none; color:var(--muted); font-size:14px; line-height:1; padding:0; }
  .class-chip button:hover{ color:var(--danger); }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--muted); }
  .empty-state .big{ font-size:36px; margin-bottom:8px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#D8D2C0; border-radius:6px; }

  .sidebar-backdrop{ display:none; }
  .hamburger-btn{ display:none; background:none; border:1px solid var(--line); border-radius:5px; padding:7px 9px; margin-right:4px; }
  .hamburger-btn svg{ width:18px; height:18px; display:block; }

  @media (max-width: 900px){
    .sidebar{
      position:fixed; left:0; top:0; height:100vh; width:250px;
      transform:translateX(-100%);
      transition:transform .22s ease;
      z-index:30;
    }
    .sidebar.open{ transform:translateX(0); box-shadow:14px 0 32px rgba(0,0,0,0.28); }
    .sidebar-backdrop.show{
      display:block; position:fixed; inset:0; background:rgba(10,14,24,0.45); z-index:25;
    }
    .hamburger-btn{ display:inline-flex; align-items:center; justify-content:center; }
    .stat-row{ grid-template-columns:1fr 1fr; }
    .form-grid{ grid-template-columns:1fr; }
    .content{ padding:18px; }
    .topbar{ padding:12px 14px; }
    .topbar-controls{ flex-wrap:wrap; justify-content:flex-end; gap:8px; }
  }
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

function uid(prefix){ return (prefix||"id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtN(n){ n = Number(n)||0; return "₦" + n.toLocaleString("en-NG",{maximumFractionDigits:0}); }
function fmtDate(iso){ if(!iso) return "—"; const d = new Date(iso); return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Default data ---------------- */
function defaultClasses(){
  return ["Nursery 1","Nursery 2","Primary 1","Primary 2","Primary 3","Primary 4","Primary 5","Primary 6","JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"];
}
function tierFor(className){
  if(className.startsWith("Nursery")) return "nursery";
  if(className.startsWith("Primary")) return "primary";
  if(className.startsWith("JSS")) return "jss";
  return "ss";
}
function defaultFeeForTier(tier){
  return {tuition:0, development:0, books:0, ict:0, exam:0, other:0};
}
function buildDefaultFeeStructure(classes){
  const fs = {};
  classes.forEach(c => { fs[c] = defaultFeeForTier(tierFor(c)); });
  return fs;
}
function freshDB(){
  const classes = defaultClasses();
  return {
    meta:{ session:"2025/2026", term:"First Term" },
    classes,
    feeStructure: buildDefaultFeeStructure(classes),
    students: [],
    payments: [],
    nextReceiptNo: 1,
  };
}

let DB = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return freshDB();
    const parsed = JSON.parse(raw);
    if(!parsed.classes || !parsed.students) return freshDB();
    return parsed;
  }catch(e){ return freshDB(); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

/* ---------------- App state (view/navigation) ---------------- */
const state = { view:"dashboard", historyFilter:{q:"", className:"", term:"", session:""}, studentSearch:"" };

/* ---------------- Derived helpers ---------------- */
function getFeeRow(className){
  return DB.feeStructure[className] || defaultFeeForTier(tierFor(className));
}
function feeRowTotal(row){
  return FEE_CATS.reduce((s,c)=> s + (Number(row[c.key])||0), 0);
}
function paymentsFor(studentId, session, term){
  return DB.payments.filter(p => p.studentId===studentId && (!session || p.session===session) && (!term || p.term===term));
}
function paidTotalsByCategory(studentId, session, term){
  const totals = {}; FEE_CATS.forEach(c=>totals[c.key]=0);
  paymentsFor(studentId, session, term).forEach(p=>{
    FEE_CATS.forEach(c=>{ totals[c.key] += Number(p.items[c.key])||0; });
  });
  return totals;
}
function studentDue(student, session, term){
  const row = getFeeRow(student.className);
  const expected = feeRowTotal(row);
  const paidByCat = paidTotalsByCategory(student.id, session, term);
  const paid = FEE_CATS.reduce((s,c)=> s+ (paidByCat[c.key]||0), 0);
  return { row, expected, paid, balance: Math.max(0, expected-paid), paidByCat };
}
function statusBadge(expected, paid){
  if(expected<=0) return '<span class="badge badge-paid">N/A</span>';
  if(paid<=0) return '<span class="badge badge-unpaid">Unpaid</span>';
  if(paid>=expected) return '<span class="badge badge-paid">Paid</span>';
  return '<span class="badge badge-partial">Partial</span>';
}
function studentById(id){ return DB.students.find(s=>s.id===id); }
function nextReceiptNo(){
  return "KSA-R-" + String(DB.nextReceiptNo).padStart(6,"0");
}

/* ---------------- Toast ---------------- */
function toast(msg){
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300); }, 2200);
}

function sessionOptions(){
  const set = new Set(DB.payments.map(p=>p.session));
  set.add(DB.meta.session);
  const known = ["2024/2025","2025/2026","2026/2027"];
  known.forEach(k=>set.add(k));
  return [...set].sort().map(s=>`<option ${s===DB.meta.session?'selected':''}>${s}</option>`).join("");
}

/* ===================================================================
   DASHBOARD
=================================================================== */
function renderDashboard(){
  const {session, term} = DB.meta;
  let expected=0, paid=0;
  const catCollected = {}; FEE_CATS.forEach(c=>catCollected[c.key]=0);
  DB.students.forEach(s=>{
    const d = studentDue(s, session, term);
    expected += d.expected; paid += d.paid;
    FEE_CATS.forEach(c=> catCollected[c.key]+= d.paidByCat[c.key]||0);
  });
  const outstanding = Math.max(0, expected-paid);
  const recent = [...DB.payments].filter(p=>p.session===session && p.term===term)
    .sort((a,b)=> new Date(b.recordedAt)-new Date(a.recordedAt)).slice(0,6);

  const maxCat = Math.max(1, ...FEE_CATS.map(c=>catCollected[c.key]));

  return `
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">STUDENTS ENROLLED</div>
        <div class="stat-value">${DB.students.length}</div>

        <div class="stat-sub">${session} · ${term}</div>
      </div>
      <div class="stat-card good">
        <div class="stat-label">COLLECTED</div>
        <div class="stat-value">${fmtN(paid)}</div>
        <div class="stat-sub">${expected? Math.round(paid/expected*100):0}% of expected</div>
      </div>
      <div class="stat-card bad">
        <div class="stat-label">OUTSTANDING</div>
        <div class="stat-value">${fmtN(outstanding)}</div>
        <div class="stat-sub">${DB.students.filter(s=>studentDue(s,session,term).balance>0).length} students owing</div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start;">
      <div class="panel">
        <div class="panel-head"><h3>Recent payments</h3><a class="btn btn-ghost btn-sm" data-nav2="history">View all</a></div>
        <div class="panel-body flush">
          <table>
            <thead><tr><th>Student</th><th>Class</th><th>Receipt</th><th>Method</th><th class="num">Amount</th></tr></thead>
            <tbody>
              ${recent.length? recent.map(p=>{
                const st = studentById(p.studentId);
                return `<tr>
                  <td>${escapeHtml(st? st.name: "Unknown")}</td>
                  <td class="muted">${escapeHtml(st? st.className: "—")}</td>
                  <td class="muted">${p.receiptNo}</td>
                  <td class="muted">${p.method}</td>
                  <td class="num">${fmtN(p.total)}</td>
                </tr>`;
              }).join("") : `<tr class="empty-row"><td colspan="5">No payments recorded yet for this term.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Collections by category</h3></div>
        <div class="panel-body">
          ${FEE_CATS.map(c=>{
            const v = catCollected[c.key];
            const pct = Math.round(v/maxCat*100);
            return `<div style="margin-bottom:13px;">
              <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;">
                <span>${c.label}</span><span class="muted">${fmtN(v)}</span>
              </div>
              <div style="background:#EFEBDF;border-radius:6px;height:7px;overflow:hidden;">
                <div style="width:${pct}%;background:var(--navy);height:100%;"></div>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
    </div>
  `;
}

function studentFormModal(existing){

  const s = existing || {admissionNo:"", name:"", className:DB.classes[0], guardian:"", phone:""};
  openModal({
    title: isEdit? "Edit Student" : "Add Student",
    bodyHtml: `
      <div class="form-grid">
        <div class="field"><label>Full name</label><input id="f_name" value="${escapeHtml(s.name)}" placeholder="e.g. Chidinma Okafor"></div>
        <div class="field"><label>Admission number</label><input id="f_adm" value="${escapeHtml(s.admissionNo)}" placeholder="KSA/2025/0006"></div>
        <div class="field"><label>Class</label>
          <select id="f_class">${DB.classes.map(c=>`<option ${c===s.className?'selected':''}>${c}</option>`).join("")}</select>
        </div>
        <div class="field"><label>Guardian name</label><input id="f_guardian" value="${escapeHtml(s.guardian)}" placeholder="Parent / guardian"></div>
        <div class="field span2"><label>Guardian phone</label><input id="f_phone" value="${escapeHtml(s.phone)}" placeholder="080…"></div>
      </div>
    `,
    footHtml: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="saveStudentBtn">${isEdit?"Save changes":"Add student"}</button>`,
    onOpen: ()=>{
      document.getElementById("saveStudentBtn").addEventListener("click", ()=>{
        const name = document.getElementById("f_name").value.trim();
        const adm = document.getElementById("f_adm").value.trim();
        if(!name){ toast("Enter the student's name"); return; }
        if(!adm){ toast("Enter an admission number"); return; }
        const payload = {
          admissionNo: adm, name,
          className: document.getElementById("f_class").value,
          guardian: document.getElementById("f_guardian").value.trim(),
          phone: document.getElementById("f_phone").value.trim(),
        };
        if(isEdit){
          Object.assign(existing, payload);
        } else {
          DB.students.push({id:uid("st"), ...payload, dateAdded: todayISO()});
        }
        saveDB(); closeModal(); render();
        toast(isEdit? "Student updated" : "Student added");
      });
    }
  });
}

function buildAllocationBlock(studentId){
  const st = studentById(studentId);
  if(!st) return {html:`<div class="empty-state" style="padding:26px 0;">Select a student to see their fee breakdown.</div>`, summary:null};
  const d = studentDue(st, document.getElementById("rp_session").value || DB.meta.session, document.getElementById("rp_term").value || DB.meta.term);
  const rowsHtml = FEE_CATS.map(c=>{
    const already = d.paidByCat[c.key]||0;
    const expected = d.row[c.key]||0;
    const bal = Math.max(0, expected-already);
    return `<div class="alloc-row">
      <div>
        <div class="cat-name">${c.label}</div>
        <div class="amt-label">Fee: ${fmtN(expected)} · Paid: ${fmtN(already)} · Balance: ${fmtN(bal)}</div>
      </div>
      <div class="amt-label">Balance</div>
      <div class="amt-label num">${fmtN(bal)}</div>
      <input type="number" min="0" step="500" data-alloc="${c.key}" data-max="${bal}" value="${bal>0? bal : 0}" placeholder="0">
    </div>`;
  }).join("");

  return {
    html: `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h4 style="margin:0; font-size:13.5px;">Fee breakdown — ${escapeHtml(st.className)}</h4>
        <button class="btn btn-ghost btn-sm" id="rp_fillFull">Fill full balance</button>
      </div>
      <div class="alloc-row" style="font-weight:600; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em;">
        <div>Category</div><div></div><div></div><div style="text-align:right;">Amount to pay</div>
      </div>
      ${rowsHtml}
    `,
    student: st, due: d,
  };
}

=================================================================== */
function renderHistory(){
  const f = state.historyFilter;
  let list = [...DB.payments];
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(p=>{
      const st = studentById(p.studentId);
      return p.receiptNo.toLowerCase().includes(q) || (st && (st.name.toLowerCase().includes(q) || st.admissionNo.toLowerCase().includes(q)));
    });
  }
  if(f.className) list = list.filter(p=>{ const st = studentById(p.studentId); return st && st.className===f.className; });
  if(f.term) list = list.filter(p=>p.term===f.term);
  if(f.session) list = list.filter(p=>p.session===f.session);
  list.sort((a,b)=> new Date(b.recordedAt)-new Date(a.recordedAt));

  const total = list.reduce((s,p)=>s+p.total,0);

  return `
    <div class="panel">
      <div class="panel-head">
        <h3>Payment history</h3>
        <div class="search-bar">
          <input id="h_q" placeholder="Search student / receipt…" value="${escapeHtml(f.q)}">
          <select id="h_class"><option value="">All classes</option>${DB.classes.map(c=>`<option ${c===f.className?'selected':''}>${c}</option>`).join("")}</select>
          <select id="h_term"><option value="">All terms</option>${TERMS.map(t=>`<option ${t===f.term?'selected':''}>${t}</option>`).join("")}</select>
          <select id="h_session"><option value="">All sessions</option>${[...new Set(DB.payments.map(p=>p.session).concat(DB.meta.session))].sort().map(s=>`<option ${s===f.session?'selected':''}>${s}</option>`).join("")}</select>
        </div>
      </div>
      <div class="panel-body flush">
        <table>
          <thead><tr><th>Date</th><th>Receipt</th><th>Student</th><th>Class</th><th>Term</th><th>Method</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody>
          ${list.length? list.map(p=>{
            const st = studentById(p.studentId);
            return `<tr>
              <td class="muted">${fmtDate(p.date)}</td>
              <td>${p.receiptNo}</td>
              <td>${escapeHtml(st? st.name:"Deleted student")}</td>
              <td class="muted">${escapeHtml(st? st.className:"—")}</td>
              <td class="muted">${p.term}</td>
              <td class="muted">${p.method}</td>
              <td class="num">${fmtN(p.total)}</td>
              <td><button class="btn btn-ghost btn-sm" data-view-receipt="${p.id}">Receipt</button>

          }).join("") : `<tr class="empty-row"><td colspan="8">No payments match your filters.</td></tr>`}
          </tbody>
          ${list.length? `<tfoot><tr><td colspan="6" style="text-align:right; font-weight:600;">Total</td><td class="num" style="font-weight:700;">${fmtN(total)}</td><td></td></tr></tfoot>`:""}
        </table>
      </div>
    </div>
  `;
}

        <div class="panel-head"><h3>Data</h3></div>
        <div class="panel-body" style="display:flex; gap:12px; flex-wrap:wrap;">
          <button class="btn" id="exportBtn">Export data (JSON)</button>
          <button class="btn btn-danger" id="resetBtn">Clear all data</button>
          <div class="muted" style="font-size:12px; align-self:center;">All data is stored locally in this browser only.</div>
        </div>
      </div>
    </div>
  `;
}

/* ===================================================================
   MODAL SYSTEM
=================================================================== */
function openModal({title, bodyHtml, footHtml, onOpen, wide}){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal ${wide?'wide':''}">
        <div class="modal-head"><h3>${title}</h3><button class="close-x" data-close>&times;</button></div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot">${footHtml||""}</div>
      </div>
    </div>
  `;
  root.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", closeModal));
  document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });
  if(onOpen) onOpen();
}
function closeModal(){ document.getElementById("modal-root").innerHTML=""; }

function confirmModal(message, onYes, opts){
  opts = opts || {};
  openModal({
    title: opts.title || "Please confirm",
    bodyHtml: `<div style="font-size:14px; line-height:1.5;">${escapeHtml(message)}</div>`,
    footHtml: `<button class="btn btn-ghost" data-close>Cancel</button><button class="btn ${opts.danger===false?'btn-primary':'btn-danger'}" id="confirmYesBtn">${opts.confirmLabel || "Yes, continue"}</button>`,
    onOpen: ()=>{
      document.getElementById("confirmYesBtn").addEventListener("click", ()=>{
        closeModal();
        onYes();
      });
    }
  });
}

/* ===================================================================
   EVENT WIRING PER VIEW
=================================================================== */
function attachViewHandlers(view){
  document.querySelectorAll("[data-nav2]").forEach(el=> el.addEventListener("click", ()=> go(el.getAttribute("data-nav2"))));

  if(view==="students"){
    document.getElementById("addStudentBtn").addEventListener("click", ()=> studentFormModal(null));
    document.getElementById("stuSearch").addEventListener("input", e=>{ state.studentSearch = e.target.value; render(); });
    document.querySelectorAll("[data-edit]").forEach(b=> b.addEventListener("click", ()=> studentFormModal(studentById(b.getAttribute("data-edit")))));
    document.querySelectorAll("[data-del]").forEach(b=> b.addEventListener("click", ()=>{
      const id = b.getAttribute("data-del"); const st = studentById(id);
      confirmModal(`Delete ${st.name}? This also removes their payment records.`, ()=>{
        DB.students = DB.students.filter(s=>s.id!==id);
        DB.payments = DB.payments.filter(p=>p.studentId!==id);
        saveDB(); render(); toast("Student deleted");
      });
    }));
    document.querySelectorAll("[data-pay]").forEach(b=> b.addEventListener("click", ()=>{
      state.presetStudent = b.getAttribute("data-pay"); go("recordPayment");
    }));
  }

  if(view==="feeStructure"){
    document.querySelectorAll(".fee-table input").forEach(inp=>{
      inp.addEventListener("input", ()=>{
        const tr = inp.closest("tr");
        const cls = tr.getAttribute("data-class-row");
        const row = {};
        tr.querySelectorAll("input[data-cat]").forEach(i=> row[i.getAttribute("data-cat")] = Number(i.value)||0);
        tr.querySelector("[data-row-total]").textContent = fmtN(feeRowTotal(row));
      });
    });
    document.getElementById("saveFeesBtn").addEventListener("click", ()=>{
      document.querySelectorAll(".fee-table tr[data-class-row]").forEach(tr=>{
        const cls = tr.getAttribute("data-class-row");
        const row = {};
        tr.querySelectorAll("input[data-cat]").forEach(i=> row[i.getAttribute("data-cat")] = Number(i.value)||0);
        DB.feeStructure[cls] = row;
      });
      saveDB(); toast("Fee structure saved"); render();
    });
  }

  if(view==="recordPayment"){
    const sel = document.getElementById("rp_student");
    if(state.presetStudent){ sel.value = state.presetStudent; state.presetStudent = null; }
    const refreshAlloc = ()=>{
      const block = buildAllocationBlock(sel.value);
      document.getElementById("rp_allocation").innerHTML = block.html;
      updateSummary();
      if(sel.value){
        document.getElementById("rp_fillFull").addEventListener("click", ()=>{
          document.querySelectorAll("[data-alloc]").forEach(i=> i.value = i.getAttribute("data-max"));
          updateSummary();
        });
        document.querySelectorAll("[data-alloc]").forEach(i=> i.addEventListener("input", updateSummary));
      }
    };
    function updateSummary(){
      const summaryEl = document.getElementById("rp_summary");
      const submitBtn = document.getElementById("rp_submit");
      if(!sel.value){ summaryEl.innerHTML = `<div class="muted" style="font-size:13px;">No student selected yet.</div>`; submitBtn.disabled = true; return; }
      const st = studentById(sel.value);
      let total = 0; const items = {};
      document.querySelectorAll("[data-alloc]").forEach(i=>{ const v = Number(i.value)||0; items[i.getAttribute("data-alloc")] = v; total += v; });
      summaryEl.innerHTML = `
        <div style="font-size:13.5px; margin-bottom:10px;"><strong>${escapeHtml(st.name)}</strong><br><span class="muted">${escapeHtml(st.admissionNo)} · ${escapeHtml(st.className)}</span></div>
        <div style="display:flex; justify-content:space-between; padding:10px 0; border-top:1px dashed var(--line); font-size:15px;">
          <span>Total to record</span><strong>${fmtN(total)}</strong>
        </div>
      `;
      submitBtn.disabled = total<=0;
      submitBtn.onclick = ()=>{
        const payment = {
          id: uid("pay"),
          receiptNo: nextReceiptNo(),
          studentId: st.id,
          session: document.getElementById("rp_session").value || DB.meta.session,
          term: document.getElementById("rp_term").value,
          date: document.getElementById("rp_date").value || todayISO(),
          items, total,
          method: document.getElementById("rp_method").value,
          note: document.getElementById("rp_note").value.trim(),
          recordedAt: new Date().toISOString(),
        };
        DB.payments.push(payment);
        DB.nextReceiptNo += 1;
        saveDB();
        toast("Payment recorded — " + payment.receiptNo);
        go("receipts");
        setTimeout(()=> openReceiptModal(payment), 60);
      };
    }
    sel.addEventListener("change", refreshAlloc);
    document.getElementById("rp_session").addEventListener("change", refreshAlloc);
    document.getElementById("rp_term").addEventListener("change", refreshAlloc);
    if(sel.value) refreshAlloc();
  }

  if(view==="receipts"){
    document.querySelectorAll("[data-view-receipt]").forEach(b=> b.addEventListener("click", ()=>{
      const p = DB.payments.find(x=>x.id===b.getAttribute("data-view-receipt"));
      if(p) openReceiptModal(p);
    }));
    document.getElementById("recSearch").addEventListener("input", e=>{
      const q = e.target.value.toLowerCase();
      const body = document.getElementById("recBody");
      const list = [...DB.payments].sort((a,b)=> new Date(b.recordedAt)-new Date(a.recordedAt)).filter(p=>{
        const st = studentById(p.studentId);
        return p.receiptNo.toLowerCase().includes(q) || (st && st.name.toLowerCase().includes(q));
      });
      body.innerHTML = list.length? list.map(receiptRow).join("") : `<tr class="empty-row"><td colspan="7">No receipts match.</td></tr>`;
      body.querySelectorAll("[data-view-receipt]").forEach(b=> b.addEventListener("click", ()=>{
        const p = DB.payments.find(x=>x.id===b.getAttribute("data-view-receipt")); if(p) openReceiptModal(p);
      }));
    });
  }

  if(view==="history"){
    const f = state.historyFilter;
    document.getElementById("h_q").addEventListener("input", e=>{ f.q=e.target.value; render(); });
    document.getElementById("h_class").addEventListener("change", e=>{ f.className=e.target.value; render(); });
    document.getElementById("h_term").addEventListener("change", e=>{ f.term=e.target.value; render(); });
    document.getElementById("h_session").addEventListener("change", e=>{ f.session=e.target.value; render(); });
    document.querySelectorAll("[data-view-receipt]").forEach(b=> b.addEventListener("click", ()=>{
      const p = DB.payments.find(x=>x.id===b.getAttribute("data-view-receipt")); if(p) openReceiptModal(p);
    }));
    document.querySelectorAll("[data-del-pay]").forEach(b=> b.addEventListener("click", ()=>{
      const payId = b.getAttribute("data-del-pay");
      confirmModal("Void this payment record? This cannot be undone.", ()=>{
        DB.payments = DB.payments.filter(p=>p.id!==payId);
        saveDB(); render(); toast("Payment voided");
      });
    }));
  }

  if(view==="outstanding"){
    document.querySelectorAll("[data-pay]").forEach(b=> b.addEventListener("click", ()=>{
      state.presetStudent = b.getAttribute("data-pay"); go("recordPayment");
    }));
  }

  if(view==="settings"){
    document.getElementById("saveMetaBtn").addEventListener("click", ()=>{
      DB.meta.session = document.getElementById("set_session").value.trim() || DB.meta.session;
      DB.meta.term = document.getElementById("set_term").value;
      saveDB(); render(); toast("Saved");
    });
    document.getElementById("addClassBtn").addEventListener("click", ()=>{
      const val = document.getElementById("newClassInput").value.trim();
      if(!val) return;
      if(DB.classes.includes(val)){ toast("That class already exists"); return; }
      DB.classes.push(val);
      DB.feeStructure[val] = defaultFeeForTier(tierFor(val));
      saveDB(); render(); toast("Class added");
    });
    document.querySelectorAll("[data-remove-class]").forEach(b=> b.addEventListener("click", ()=>{
      const cls = b.getAttribute("data-remove-class");
      const inUse = DB.students.some(s=>s.className===cls);
      const doRemove = ()=>{
        DB.classes = DB.classes.filter(c=>c!==cls);
        saveDB(); render(); toast("Class removed");
      };
      if(inUse){
        confirmModal(`${cls} has students assigned. Remove it from the class list anyway?`, doRemove);
      } else {
        doRemove();
      }
    }));
    document.getElementById("exportBtn").addEventListener("click", ()=>{
      const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "kingdom-scholar-academy-fees-" + todayISO() + ".json";
      a.click();
    });
    document.getElementById("resetBtn").addEventListener("click", ()=>{
      confirmModal("This permanently deletes all students, payments, and receipts. Continue?", ()=>{
        DB = freshDB(); saveDB(); render(); toast("All data cleared");
      }, {confirmLabel:"Yes, clear everything"});
    });
  }
}

render();
</script>
</body>
</html>
